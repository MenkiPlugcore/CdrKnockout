name: Build CdrKnockout

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify build
        run: mvn -B clean verify

      - name: Validate release jar
        shell: bash
        run: |
          test -f target/CdrKnockout-1.0.3.jar
          jar tf target/CdrKnockout-1.0.3.jar | grep -F 'dev/cadera/cdrknockout/CdrKnockoutPlugin.class'
          jar tf target/CdrKnockout-1.0.3.jar | grep -F 'dev/cadera/cdrknockout/platform/PoseEngine.class'
          jar tf target/CdrKnockout-1.0.3.jar | grep -F 'dev/cadera/cdrknockout/diagnostic/ProductionDiagnostics.class'
          jar tf target/CdrKnockout-1.0.3.jar | grep -F 'dev/cadera/cdrknockout/license/LicenseGuard.class'
          jar tf target/CdrKnockout-1.0.3.jar | grep -F 'license-template.txt'
          unzip -p target/CdrKnockout-1.0.3.jar plugin.yml | grep -F "version: '1.0.3'"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: CdrKnockout-1.0.3
          path: target/CdrKnockout-1.0.3.jar
          if-no-files-found: error
