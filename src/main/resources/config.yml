# CdrKnockout v1.0.1 — Production Stable
# Paper 1.21.11 + Java 21

config-version: 1
debug: false

# Production hardening and operator diagnostics.
production:
  expected-minecraft-version: '1.21.11'
  warn-unsupported-minecraft-version: true
  startup-diagnostics: true
  log-on-reload: true

  # Runtime license integrity check. LICENSE.txt is mandatory and cannot be disabled by config.
  # This only controls how often the already-mandatory integrity check runs while the server is online.
  license-integrity-check-ticks: 100

  # Built-in recovery/control commands tetap dapat dipakai saat KNOCKED walau
  # config lama belum memiliki command tersebut di allowed list.
  always-allow-knocked-plugin-commands: true

knockout:
  enabled: true
  duration-seconds: 60
  minimum-health: 1.0
  respect-totem-of-undying: true

  ignored-gamemodes:
    - CREATIVE
    - SPECTATOR

  ignored-damage-causes:
    - KILL

  worlds:
    mode: ALL
    list: []

  pose:
    enabled: true
    mode: SWIMMING

  movement:
    lock-position: true
    allow-camera: true
    zero-velocity: true

  effects:
    blindness:
      enabled: true
      amplifier: 0
    weakness:
      enabled: true
      amplifier: 4
    slowness:
      enabled: true
      amplifier: 10
    darkness:
      enabled: false
      amplifier: 0

  restrictions:
    attack: true
    interact: true
    item-use: true
    item-drop: true
    inventory: true
    teleport: true
    commands:
      enabled: true
      allowed:
        - msg
        - r
        - reply
        - helpop
        - giveup
        - selfrevive
        - distress
        - kostats
        - cdrko
        - cdrknockout
        - cko

  display:
    actionbar:
      enabled: true
      text: '&c&lKNOCKED &8| &fBleedout: &c%time%s'
    title:
      enabled: true
      title: '&c&lKNOCKED'
      subtitle: '&7Wait for help...'

  bleedout:
    enabled: true
    warnings:
      enabled: true
      thresholds-seconds: [30, 10, 5]
      chat-enabled: true
      title:
        enabled: true
        title: '&c&lBLEEDING OUT'
        subtitle: '&f%time%s remaining'
      sound: 'minecraft:block.note_block.bass'
      volume: 0.9
      pitch: 0.7

    heartbeat:
      enabled: true
      start-at-seconds: 10
      interval-ms: 1000
      sound: 'minecraft:entity.warden.heartbeat'
      volume: 0.8
      pitch: 1.0

    downed-damage:
      default-mode: REDUCE_TIMER
      default-reduce-seconds: 4
      display-penalty-actionbar: true
      penalty-actionbar: '&4-%seconds%s &7bleedout &8| &c%time%s left'
      cause-overrides:
        VOID:
          mode: INSTANT_DEATH
        LAVA:
          mode: REDUCE_TIMER
          reduce-seconds: 8
        FIRE:
          mode: REDUCE_TIMER
          reduce-seconds: 4
        FIRE_TICK:
          mode: REDUCE_TIMER
          reduce-seconds: 2
        DROWNING:
          mode: REDUCE_TIMER
          reduce-seconds: 5
        SUFFOCATION:
          mode: REDUCE_TIMER
          reduce-seconds: 4
        FREEZE:
          mode: REDUCE_TIMER
          reduce-seconds: 4
        ENTITY_EXPLOSION:
          mode: REDUCE_TIMER
          reduce-seconds: 10
        BLOCK_EXPLOSION:
          mode: REDUCE_TIMER
          reduce-seconds: 10
        FALL:
          mode: IGNORE

    giveup:
      enabled: true

revive:
  enabled: true
  max-distance: 1.0
  duration-seconds: 8.0

  requirements:
    mode: ALL
    any-priority:
      - ITEM
      - XP_LEVEL
      - MONEY
      - AURASKILLS
      - PERMISSION
    failure-message-cooldown-ms: 2000

    item:
      enabled: true
      material: GOLDEN_APPLE
      amount: 1
      consume-on-success: true

    xp-level:
      enabled: false
      minimum-level: 10
      consume-on-success: false
      consume-levels: 0

    money:
      enabled: false
      amount: 5000.0
      withdraw-on-success: true

    auraskills:
      enabled: false
      skill: FIGHTING
      minimum-level: 20.0

    permission:
      enabled: false
      node: cdrknockout.revive.special

  channel:
    cancel-on-damage: true
    cancel-on-attack: true
    cancel-on-move: false
    move-tolerance: 0.10

  result:
    health: 6.0
    resistance-seconds: 3

  display:
    actionbar:
      enabled: true
      bar-segments: 10
      reviver-text: '&a✚ REVIVING &f%target% &8| %bar% &f%percent%%%'
      target-text: '&a✚ &f%reviver% &ais reviving you &8| %bar% &f%percent%%%'
      success-reviver: '&a&lREVIVE SUCCESS'
      success-target: '&a&lREVIVED'
      cancelled: '&c&lREVIVE INTERRUPTED'

execution:
  enabled: true
  max-distance: 1.0
  duration-seconds: 3.0
  require-sneak: true
  permission: cdrknockout.execute

  item:
    required: true
    allowed-materials:
      - WOODEN_SWORD
      - STONE_SWORD
      - IRON_SWORD
      - GOLDEN_SWORD
      - DIAMOND_SWORD
      - NETHERITE_SWORD

  channel:
    cancel-on-damage: true
    cancel-on-target-damage: false
    cancel-on-attack: true
    cancel-on-move: false
    move-tolerance: 0.10
    cancel-on-item-change: true

  display:
    actionbar:
      enabled: true
      bar-segments: 10
      executor-text: '&4☠ EXECUTING &f%target% &8| %bar% &f%percent%%%'
      target-text: '&4☠ &f%executor% &cis executing you &8| %bar% &f%percent%%%'
      success-executor: '&4&lEXECUTION COMPLETE'
      success-target: '&4&lEXECUTED'
      cancelled: '&c&lEXECUTION INTERRUPTED'

stability:
  persistence:
    enabled: true
    autosave-ticks: 40
    offline-time-counts: true
    restore-anchor-on-join: true
    join-recovery-delay-ticks: 2
    missing-world-policy: CURRENT

  teleport:
    mode: BLOCK
    reassert-on-world-change: true

compatibility:
  client:
    detection:
      enabled: true
      log-status: true
    pose:
      java-mode: SWIMMING
      bedrock-mode: SWIMMING
      unknown-mode: SWIMMING

  axgraves:
    enabled: true
    block-graves-while-knocked: true
    prevent-duplicate-managed-graves: true
    duplicate-window-ticks: 40
    log-diagnostics: false

api:
  events:
    enabled: true
    poll-ticks: 2

placeholderapi:
  enabled: true

gameplay:
  self-revive:
    enabled: true
    auto-start: true
    duration-seconds: 10.0
    cooldown-seconds: 120
    restart-delay-ms: 1500
    cancel-on-damage: true

    item:
      material: ENCHANTED_GOLDEN_APPLE
      amount: 1
      consume-on-success: true

    result:
      health: 4.0
      resistance-seconds: 3

    actionbar:
      enabled: true
      bar-segments: 10
      progress: '&e✚ SELF REVIVING &8| %bar% &f%percent%%%'
      success: '&a&lSELF REVIVE SUCCESS'
      cancelled: '&c&lSELF REVIVE INTERRUPTED'

  medical:
    enabled: true
    require-role-permission: true
    role-permission: cdrknockout.medic

    medkit:
      enabled: true
      material: PAPER
      name: '&c&lMedical Kit'
      lore:
        - '&7Emergency revival equipment.'
        - '&7Sneak dekat player KNOCKED untuk memakai.'
      consume-on-success: true
      bypass-standard-requirements: true

  distress:
    enabled: true
    cooldown-seconds: 15
    radius: 64.0
    skip-knocked-receivers: true
    require-receive-permission: false
    sound:
      enabled: true
      name: 'minecraft:block.note_block.pling'
      volume: 0.8
      pitch: 1.2

  statistics:
    enabled: true
    autosave-ticks: 200

admin-revive:
  health: 6.0
  resistance-seconds: 3
