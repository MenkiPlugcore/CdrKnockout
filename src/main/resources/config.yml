# CdrKnockout v0.2.0
# Core Knockout + Passive Revive + Requirement Engine

debug: false

knockout:
  enabled: true
  duration-seconds: 60
  minimum-health: 1.0

  respect-totem-of-undying: true

  ignored-gamemodes:
    - CREATIVE
    - SPECTATOR

  ignored-damage-causes:
    - VOID
    - KILL

  worlds:
    # ALL = semua world
    # WHITELIST = hanya world pada list
    # BLACKLIST = semua kecuali world pada list
    mode: ALL
    list: []

  pose:
    enabled: true
    mode: SWIMMING

  movement:
    lock-position: true
    allow-camera: true
    zero-velocity: true

  effects:
    blindness:
      enabled: true
      amplifier: 0
    weakness:
      enabled: true
      amplifier: 4
    slowness:
      enabled: true
      amplifier: 10
    darkness:
      enabled: false
      amplifier: 0

  restrictions:
    attack: true
    interact: true
    item-use: true
    item-drop: true
    inventory: true
    teleport: true
    commands:
      enabled: true
      allowed:
        - msg
        - r
        - reply
        - helpop
        - cdrko
        - cdrknockout
        - cko

  display:
    actionbar:
      enabled: true
      text: '&c&lKNOCKED &8| &fBleedout: &c%time%s'
    title:
      enabled: true
      title: '&c&lKNOCKED'
      subtitle: '&7Wait for help...'

  bleedout:
    enabled: true

revive:
  enabled: true
  max-distance: 1.0
  duration-seconds: 8.0

  # v0.2.0 Requirement Engine
  requirements:
    # ALL = seluruh requirement yang enabled wajib terpenuhi.
    # ANY = cukup satu requirement enabled; requirement terpilih mengikuti any-priority.
    mode: ALL

    # Khusus mode ANY. Requirement pertama yang terpenuhi menjadi requirement sesi
    # dan hanya cost dari requirement terpilih yang dikonsumsi saat sukses.
    any-priority:
      - ITEM
      - XP_LEVEL
      - MONEY
      - AURASKILLS
      - PERMISSION

    # Mencegah spam pesan ketika player jongkok dekat target tetapi syarat belum terpenuhi.
    failure-message-cooldown-ms: 2000

    item:
      enabled: true
      material: GOLDEN_APPLE
      amount: 1
      consume-on-success: true

    xp-level:
      enabled: false
      minimum-level: 10
      consume-on-success: false
      consume-levels: 0

    # Membutuhkan Vault + economy provider jika diaktifkan.
    money:
      enabled: false
      amount: 5000.0
      withdraw-on-success: true

    # Membutuhkan AuraSkills jika diaktifkan.
    # Integrasi v0.2.0 mendukung built-in skill enum seperti FIGHTING/MINING/FARMING.
    auraskills:
      enabled: false
      skill: FIGHTING
      minimum-level: 20.0

    permission:
      enabled: false
      node: cdrknockout.revive.special

  channel:
    # Revive selalu batal jika berhenti jongkok, menjauh > max-distance,
    # requirement sesi tidak lagi terpenuhi, mati, KO, logout, atau pindah world.
    cancel-on-damage: true
    cancel-on-attack: true
    cancel-on-move: false
    move-tolerance: 0.10

  result:
    health: 6.0
    resistance-seconds: 3

  display:
    actionbar:
      enabled: true
      bar-segments: 10
      reviver-text: '&a✚ REVIVING &f%target% &8| %bar% &f%percent%%%'
      target-text: '&a✚ &f%reviver% &ais reviving you &8| %bar% &f%percent%%%'
      success-reviver: '&a&lREVIVE SUCCESS'
      success-target: '&a&lREVIVED'
      cancelled: '&c&lREVIVE INTERRUPTED'

admin-revive:
  health: 6.0
  resistance-seconds: 3
