# CdrKnockout v0.2.1
# Core Knockout + Passive Revive + Requirement Engine + Bleedout & Death Engine

debug: false

knockout:
  enabled: true
  duration-seconds: 60
  minimum-health: 1.0

  respect-totem-of-undying: true

  ignored-gamemodes:
    - CREATIVE
    - SPECTATOR

  # v0.2.1: VOID tidak lagi di-ignore secara default supaya bisa masuk KO lalu
  # diproses oleh environmental/downed damage engine.
  ignored-damage-causes:
    - KILL

  worlds:
    mode: ALL
    list: []

  pose:
    enabled: true
    mode: SWIMMING

  movement:
    lock-position: true
    allow-camera: true
    zero-velocity: true

  effects:
    blindness:
      enabled: true
      amplifier: 0
    weakness:
      enabled: true
      amplifier: 4
    slowness:
      enabled: true
      amplifier: 10
    darkness:
      enabled: false
      amplifier: 0

  restrictions:
    attack: true
    interact: true
    item-use: true
    item-drop: true
    inventory: true
    teleport: true
    commands:
      enabled: true
      allowed:
        - msg
        - r
        - reply
        - helpop
        - giveup
        - cdrko
        - cdrknockout
        - cko

  display:
    actionbar:
      enabled: true
      text: '&c&lKNOCKED &8| &fBleedout: &c%time%s'
    title:
      enabled: true
      title: '&c&lKNOCKED'
      subtitle: '&7Wait for help...'

  bleedout:
    enabled: true

    # Warning hanya dikirim sekali pada threshold yang tepat.
    warnings:
      enabled: true
      thresholds-seconds: [30, 10, 5]
      chat-enabled: true
      title:
        enabled: true
        title: '&c&lBLEEDING OUT'
        subtitle: '&f%time%s remaining'
      sound: 'minecraft:block.note_block.bass'
      volume: 0.9
      pitch: 0.7

    # Detak jantung saat kondisi kritis.
    heartbeat:
      enabled: true
      start-at-seconds: 10
      interval-ms: 1000
      sound: 'minecraft:entity.warden.heartbeat'
      volume: 0.8
      pitch: 1.0

    # Damage yang diterima saat sudah KNOCKED tidak mengurangi HP secara vanilla.
    # IGNORE        = damage dibatalkan, timer tidak berubah.
    # REDUCE_TIMER  = damage dibatalkan, waktu bleedout dipotong.
    # INSTANT_DEATH = langsung real death melalui jalur normal PlayerDeathEvent.
    downed-damage:
      default-mode: REDUCE_TIMER
      default-reduce-seconds: 4
      display-penalty-actionbar: true
      penalty-actionbar: '&4-%seconds%s &7bleedout &8| &c%time%s left'

      cause-overrides:
        VOID:
          mode: INSTANT_DEATH
        LAVA:
          mode: REDUCE_TIMER
          reduce-seconds: 8
        FIRE:
          mode: REDUCE_TIMER
          reduce-seconds: 4
        FIRE_TICK:
          mode: REDUCE_TIMER
          reduce-seconds: 2
        DROWNING:
          mode: REDUCE_TIMER
          reduce-seconds: 5
        SUFFOCATION:
          mode: REDUCE_TIMER
          reduce-seconds: 4
        FREEZE:
          mode: REDUCE_TIMER
          reduce-seconds: 4
        ENTITY_EXPLOSION:
          mode: REDUCE_TIMER
          reduce-seconds: 10
        BLOCK_EXPLOSION:
          mode: REDUCE_TIMER
          reduce-seconds: 10
        FALL:
          mode: IGNORE

    giveup:
      enabled: true

revive:
  enabled: true
  max-distance: 1.0
  duration-seconds: 8.0

  requirements:
    mode: ALL

    any-priority:
      - ITEM
      - XP_LEVEL
      - MONEY
      - AURASKILLS
      - PERMISSION

    failure-message-cooldown-ms: 2000

    item:
      enabled: true
      material: GOLDEN_APPLE
      amount: 1
      consume-on-success: true

    xp-level:
      enabled: false
      minimum-level: 10
      consume-on-success: false
      consume-levels: 0

    money:
      enabled: false
      amount: 5000.0
      withdraw-on-success: true

    auraskills:
      enabled: false
      skill: FIGHTING
      minimum-level: 20.0

    permission:
      enabled: false
      node: cdrknockout.revive.special

  channel:
    cancel-on-damage: true
    cancel-on-attack: true
    cancel-on-move: false
    move-tolerance: 0.10

  result:
    health: 6.0
    resistance-seconds: 3

  display:
    actionbar:
      enabled: true
      bar-segments: 10
      reviver-text: '&a✚ REVIVING &f%target% &8| %bar% &f%percent%%%'
      target-text: '&a✚ &f%reviver% &ais reviving you &8| %bar% &f%percent%%%'
      success-reviver: '&a&lREVIVE SUCCESS'
      success-target: '&a&lREVIVED'
      cancelled: '&c&lREVIVE INTERRUPTED'

admin-revive:
  health: 6.0
  resistance-seconds: 3
