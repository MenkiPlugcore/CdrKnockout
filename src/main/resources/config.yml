# CdrKnockout v0.1.1
# Core Knockout + Passive Proximity Revive

debug: false

knockout:
  enabled: true
  duration-seconds: 60
  minimum-health: 1.0

  respect-totem-of-undying: true

  ignored-gamemodes:
    - CREATIVE
    - SPECTATOR

  ignored-damage-causes:
    - VOID
    - KILL

  worlds:
    # ALL = semua world
    # WHITELIST = hanya world pada list
    # BLACKLIST = semua kecuali world pada list
    mode: ALL
    list: []

  pose:
    enabled: true
    mode: SWIMMING

  movement:
    lock-position: true
    allow-camera: true
    zero-velocity: true

  effects:
    blindness:
      enabled: true
      amplifier: 0
    weakness:
      enabled: true
      amplifier: 4
    slowness:
      enabled: true
      amplifier: 10
    darkness:
      enabled: false
      amplifier: 0

  restrictions:
    attack: true
    interact: true
    item-use: true
    item-drop: true
    inventory: true
    teleport: true
    commands:
      enabled: true
      allowed:
        - msg
        - r
        - reply
        - helpop
        - cdrko
        - cdrknockout
        - cko

  display:
    actionbar:
      enabled: true
      text: '&c&lKNOCKED &8| &fBleedout: &c%time%s'
    title:
      enabled: true
      title: '&c&lKNOCKED'
      subtitle: '&7Wait for help...'

  bleedout:
    enabled: true

# v0.1.1 Passive Revive
# Tidak menggunakan klik kiri/kanan. Penolong cukup dekat, pegang item di main hand, lalu jongkok.
revive:
  enabled: true
  max-distance: 1.0
  duration-seconds: 8.0

  item:
    enabled: true
    material: GOLDEN_APPLE
    amount: 1
    # Item hanya hilang setelah revive 100% berhasil.
    consume-on-success: true

  channel:
    # Revive selalu batal jika berhenti jongkok, menjauh > max-distance,
    # mengganti/kehilangan item, mati, KO, logout, atau pindah world.
    cancel-on-damage: true
    cancel-on-attack: true
    # Default false: reviver boleh menyesuaikan posisi selama tetap <= 1 block.
    cancel-on-move: false
    move-tolerance: 0.10

  result:
    health: 6.0
    resistance-seconds: 3

  display:
    actionbar:
      enabled: true
      bar-segments: 10
      reviver-text: '&a✚ REVIVING &f%target% &8| %bar% &f%percent%%%'
      target-text: '&a✚ &f%reviver% &ais reviving you &8| %bar% &f%percent%%%'
      success-reviver: '&a&lREVIVE SUCCESS'
      success-target: '&a&lREVIVED'
      cancelled: '&c&lREVIVE INTERRUPTED'

admin-revive:
  health: 6.0
  resistance-seconds: 3
