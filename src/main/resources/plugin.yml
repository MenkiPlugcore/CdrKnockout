name: CdrKnockout
version: '${project.version}'
main: dev.cadera.cdrknockout.CdrKnockoutPlugin
api-version: '1.21'
author: CADERA
description: Modular knockout, revive, and requirement engine for Paper servers.
website: https://github.com/MenkiPlugcore/CdrKnockout
softdepend: [Vault, AuraSkills]

commands:
  cdrko:
    description: CdrKnockout administration command.
    usage: /cdrko <reload|knockout|revive|kill|status> [player]
    aliases: [cdrknockout, cko]
    permission: cdrknockout.command

permissions:
  cdrknockout.command:
    default: op
  cdrknockout.command.reload:
    default: op
  cdrknockout.command.knockout:
    default: op
  cdrknockout.command.revive:
    default: op
  cdrknockout.command.kill:
    default: op
  cdrknockout.command.status:
    default: op
  cdrknockout.bypass:
    description: Prevent automatic lethal damage from entering knockout.
    default: false
  cdrknockout.revive.special:
    description: Example permission requirement for revive.
    default: false
