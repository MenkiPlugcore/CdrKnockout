name: CdrKnockout
version: '${project.version}'
main: dev.cadera.cdrknockout.CdrKnockoutPlugin
api-version: '1.21'
author: CADERA
description: Modular knockout, revive, execution, persistence, stability, and AxGraves compatibility engine for Paper servers.
website: https://github.com/MenkiPlugcore/CdrKnockout
softdepend: [Vault, AuraSkills, AxGraves]

commands:
  cdrko:
    description: CdrKnockout administration command.
    usage: /cdrko <reload|knockout|revive|kill|status|compat> [player]
    aliases: [cdrknockout, cko]
    permission: cdrknockout.command
  giveup:
    description: Give up while KNOCKED and enter real death.
    usage: /giveup
    permission: cdrknockout.giveup

permissions:
  cdrknockout.command:
    default: op
  cdrknockout.command.reload:
    default: op
  cdrknockout.command.knockout:
    default: op
  cdrknockout.command.revive:
    default: op
  cdrknockout.command.kill:
    default: op
  cdrknockout.command.status:
    default: op
  cdrknockout.command.compat:
    description: Show AxGraves compatibility diagnostics.
    default: op
  cdrknockout.bypass:
    description: Prevent automatic lethal damage from entering knockout.
    default: false
  cdrknockout.revive.special:
    description: Example permission requirement for revive.
    default: false
  cdrknockout.execute:
    description: Allows a player to execute KNOCKED players when execution is enabled.
    default: true
  cdrknockout.giveup:
    description: Allows a knocked player to use /giveup.
    default: true
