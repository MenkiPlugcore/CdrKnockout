name: CdrKnockout
version: '${project.version}'
main: dev.cadera.cdrknockout.CdrKnockoutPlugin
api-version: '1.21'
author: CADERA
description: Modular knockout, revive, execution, gameplay expansion, public API, PlaceholderAPI, Java/Bedrock compatibility, persistence, stability, and AxGraves engine for Paper servers.
website: https://github.com/MenkiPlugcore/CdrKnockout
softdepend: [Vault, AuraSkills, AxGraves, Geyser-Spigot, floodgate, PlaceholderAPI]

commands:
  cdrko:
    description: CdrKnockout administration command.
    usage: /cdrko <reload|knockout|revive|kill|status|compat|platform> [player]
    aliases: [cdrknockout, cko]
    permission: cdrknockout.command
  giveup:
    description: Give up while KNOCKED and enter real death.
    usage: /giveup
    permission: cdrknockout.giveup
  selfrevive:
    description: Start self revive while KNOCKED when requirements are met.
    usage: /selfrevive
    permission: cdrknockout.selfrevive
  distress:
    description: Send a distress signal to nearby players while KNOCKED.
    usage: /distress
    permission: cdrknockout.distress
  kostats:
    description: Show CdrKnockout gameplay statistics.
    usage: /kostats [player]
    permission: cdrknockout.stats
  medkit:
    description: Give CdrKnockout Medical Kit items.
    usage: /medkit <player> [amount]
    permission: cdrknockout.medkit.give

permissions:
  cdrknockout.command:
    default: op
  cdrknockout.command.reload:
    default: op
  cdrknockout.command.knockout:
    default: op
  cdrknockout.command.revive:
    default: op
  cdrknockout.command.kill:
    default: op
  cdrknockout.command.status:
    default: op
  cdrknockout.command.compat:
    default: op
  cdrknockout.command.platform:
    default: op
  cdrknockout.bypass:
    default: false
  cdrknockout.revive.special:
    default: false
  cdrknockout.execute:
    default: true
  cdrknockout.giveup:
    default: true
  cdrknockout.selfrevive:
    default: true
  cdrknockout.distress:
    default: true
  cdrknockout.distress.receive:
    default: true
  cdrknockout.medic:
    description: Allows use of CdrKnockout Medical Kits as a medic role.
    default: false
  cdrknockout.medkit.give:
    default: op
  cdrknockout.stats:
    default: true
  cdrknockout.stats.others:
    default: op
